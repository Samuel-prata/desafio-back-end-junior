services:
  db-postgres:
    image: postgres:latest
    container_name: my_postgres
    environment:
      POSTGRES_DB: db_school
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db_school"]
      interval: 5s
      timeout: 5s
      retries: 5

  back-end:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      DB_NAME: db_school
      DB_USER: user
      DB_PASSWORD: password